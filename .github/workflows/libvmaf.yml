name: libvmaf
on:
  push:
  pull_request:

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  libvmaf-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64-gcc
            os: ubuntu-latest
            CC: ccache gcc
            CXX: ccache g++
          - name: linux-x86_64-gcc-9
            os: ubuntu-latest
            CC: ccache gcc-9
            CXX: ccache g++-9
          - name: linux-x86_64-clang
            os: ubuntu-latest
            CC: ccache clang
            CXX: ccache clang++
          - name: macos-clang
            os: macos-latest
            CC: ccache clang
            CXX: ccache clang++
            experimental: true
          - name: linux-arm64-clang
            os: ubuntu-24.04-arm
            CC: ccache clang
            CXX: ccache clang++
          - name: linux-i686-gcc
            os: ubuntu-latest
            CC: ccache gcc
            CXX: ccache g++
            CROSS: ./libvmaf/test/meson-toolchains/i686-pc-linux-gnu-gcc-cross.ini
          - name: linux-i686-clang
            os: ubuntu-latest
            CC: ccache clang
            CXX: ccache clang++
            CROSS: ./libvmaf/test/meson-toolchains/i686-pc-linux-gnu-clang-cross.ini
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.CC }}
      CXX: ${{ matrix.CXX }}
      CROSS: ${{ matrix.CROSS }}
    steps:
      - name: Setup python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.11
      - name: Install meson and ninja
        run: |
          python -m pip install --upgrade pip
          pip install meson

      - name: Install dependencies (ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo -E apt-get -yq install ccache ninja-build libomp-dev
          case "$CC" in
          *gcc) sudo -E apt-get -yq install gcc g++ nasm ;;
          *gcc-9)
            sudo -E apt-add-repository -y "ppa:ubuntu-toolchain-r/test"
            sudo -E apt-get -yq install gcc-9 g++-9 nasm
            ;;
          *clang) sudo -E apt-get -yq install clang llvm nasm ;;
          esac
          if [ -n "$CROSS" ]; then
            sudo -E apt-get -yq install gcc-multilib g++-multilib
          fi
          $CC --version
          meson --version
          ccache --version

      - name: Install dependencies (mac)
        if: matrix.os == 'macos-latest'
        run: |
          brew install -q ninja nasm ccache llvm

          $CC --version
          meson --version
          ccache --version

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run meson
        run: |
          meson setup libvmaf libvmaf/build --buildtype release --prefix $PWD/install -Denable_float=true ${CROSS:+--cross-file $CROSS}
      - name: Run ninja
        run: |
          sudo ninja -vC libvmaf/build install
      - name: Run tests
        run: |
          sudo ninja -vC libvmaf/build test
      - name: Set up tox
        run: |
          mkdir -p ~/.ccache && sudo chown -R $(whoami) ~/.ccache
          pip install tox
      - name: Run tox tests (ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          tox -c python
      - name: Run tox tests (mac)
        if: matrix.os == 'macos-latest'
        run: |
          PATH=$(brew --prefix)/opt/llvm/bin:$PATH \
          CC=$(brew --prefix)/opt/llvm/bin/clang \
          CXX=$(brew --prefix)/opt/llvm/bin/clang++ \
          tox -c python

      - name: Get binary path & Current Release
        id: get_info
        run: |
          ldd "./install/bin/vmaf" || true
          echo "path=./install/bin/vmaf" >> $GITHUB_OUTPUT
          echo "upload_url=$(curl -L https://api.github.com/repos/${{ github.repository }}/releases/tags/$(cut -d/ -f3 <<< ${{ github.ref }}) | jq -r ."upload_url")" >> $GITHUB_OUTPUT

      - name: Package vmaf
        id: package
        run: |
          zip_path="vmaf-${{ matrix.name }}.zip"
          zip -j "$zip_path" "${{ steps.get_info.outputs.path }}"
          echo "zip_path=$zip_path" >> $GITHUB_OUTPUT

      - name: Upload vmaf
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vmaf-${{ matrix.name }}
          path: ${{ steps.package.outputs.zip_path }}
      - name: Upload vmaf
        if: steps.get_info.outputs.upload_url != 'null'
        uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5 # v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.get_info.outputs.upload_url }}
          asset_path: ${{ steps.package.outputs.zip_path }}
          asset_name: ${{ steps.package.outputs.zip_path }}
          asset_content_type: application/zip
